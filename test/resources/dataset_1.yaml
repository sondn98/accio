seed: 1753027364
datasets:
  - name: ds1
    size: 100
    output:
      - csv_output
    columns:
      - name: field_1
        spec:
          type: integer
          max: 10
          min: 0
        conditions:
          - predicate: field_2 = field_3
            spec:
              type: integer
              const: 20

      - name: field_2
        spec:
          type: text
          const: Lorem Ipsum

      - name: field_3
        type: text
        conditions:
          - predicate: field_4 < field_6
            spec:
              type: text
              const: Lorem Ipsum
        spec:
          type: text
          allowed_values:
            - Lorem Ipsum
            - C'mon, let's go
            - Hello, world!
            - I'm Accio

      - name: field_4
        spec:
          type: integer
          const: 123

      - name: field_5
        spec:
          type: date
          min: 2024-01-14

      - name: field_6
        spec:
          type: integer
          min: 100
          max: 200

outputs:
  - name: csv_output
    type: csv
    output_folder: /tmp/dataset

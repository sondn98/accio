          allowed_values:
            - C'mon, let's go
            - Hello, world!
            - I'm Accio

      - name: field_4
        spec:
          type: integer
          const: 123

      - name: field_5
        spec:
          type: date
          min: 2024-01-14

      - name: field_6
        spec:
          type: integer
          min: 100
          max: 200

